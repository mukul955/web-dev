<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - EduLearn</title>

<style>
body {
  font-family: Arial;
  background: #eef2f7;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background-image: url(background.jpg);
}

.side img{
  position: absolute;
  height: 200px;
  width: 250px;
  top: 25px;
  right: 50px;
  border-radius: 25px;
}

.login-box {
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  width:300px;
  
}

h2 { text-align:center; }

input {
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:10px;
  background:#1e3a8a;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover { background:#3749c7; }

#msg { text-align:center; margin-top:10px; }
</style>
</head>

<body>
<div class="side">
  <img src="images.png" alt="">
</div>

<div class="login-box">
  <h2>Login EduSmart</h2>

  <input type="text" id="user" placeholder="Username">
  <input type="password" id="pass" placeholder="Password">

  <button type="button" onclick="login()">Login</button>

  <p id="msg"></p>
</div>

<script>
function login() {
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === "admin" && p === "1234") {
    document.getElementById("msg").innerHTML = "Login Successful!";
    document.getElementById("msg").style.color = "green";

    setTimeout(() => {
      window.location.href = "project.html";
    }, 1000);

  } else {
    document.getElementById("msg").innerHTML = "Wrong Username or Password";
    document.getElementById("msg").style.color = "red";
  }
}
</script>

</body>
</html>
